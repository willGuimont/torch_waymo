[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_waymo"
version = "0.2.0"
authors = [
    { name = "William Guimont-Martin", email = "william.guimont-martin@norlab.ulaval.ca" },
]
description = "Load Waymo Open Dataset in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.23.5",
    "torch>=2",
    "tqdm>=4.65",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
waymo = [
    "protobuf==3.20.3; python_version < '3.11'",
    "waymo-open-dataset-tf-2-12-0==1.6.7; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version < '3.11'",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.13",
    "twine>=6",
]

[project.urls]
"Homepage" = "https://github.com/willGuimont/torch_waymo"
"Bug Tracker" = "https://github.com/willGuimont/torch_waymo/issues"

[project.scripts]
torch-waymo-convert = "torch_waymo.convert_waymo:main"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
